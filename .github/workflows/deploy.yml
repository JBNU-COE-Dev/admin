name: Deploy Admin Web

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      no_cache:
        description: '캐시 없이 빌드'
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          NO_CACHE: ${{ inputs.no_cache }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        with:
          host: ${{ secrets.JCLOUD_SSH_HOST }}
          username: ${{ secrets.JCLOUD_SSH_USER }}
          key: ${{ secrets.JCLOUD_SSH_KEY }}
          port: ${{ secrets.JCLOUD_SSH_PORT }}
          envs: NO_CACHE,VITE_API_BASE_URL
          script: |
            set -e
            REPO_DIR=/home/ubuntu/admin
            COMPOSE_FILE=/home/ubuntu/docker-compose.yml
            SERVICE=admin-front
            WAIT_SEC=10

            if [ -z "$VITE_API_BASE_URL" ]; then
              echo "WARN: VITE_API_BASE_URL Secret 미설정 — 서버 .env 값을 사용합니다"
              unset VITE_API_BASE_URL
            fi

            cd "$REPO_DIR" || { echo "ERR: $REPO_DIR 없음"; exit 1; }

            echo "=== main 최신화 ==="
            git fetch --prune origin main
            git checkout -B main origin/main
            echo "빌드할 커밋: $(git log -1 --oneline)"

            BUILD_OPTS=""
            if [ "$NO_CACHE" = "true" ]; then
              BUILD_OPTS="--no-cache"
            fi

            echo "=== 빌드 ==="
            docker compose -f "$COMPOSE_FILE" build $BUILD_OPTS "$SERVICE"

            echo "=== 컨테이너 교체 ==="
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate "$SERVICE"

            echo "=== 기동 확인 (${WAIT_SEC}초 대기) ==="
            sleep "$WAIT_SEC"

            CID=$(docker compose -f "$COMPOSE_FILE" ps -q "$SERVICE")
            if [ -z "$CID" ]; then
              echo "ERR: $SERVICE 컨테이너를 찾을 수 없음 — 최근 로그 100줄"
              docker compose -f "$COMPOSE_FILE" logs --tail=100 "$SERVICE"
              exit 1
            fi

            STATUS=$(docker inspect -f '{{.State.Status}}' "$CID")
            RESTARTS=$(docker inspect -f '{{.RestartCount}}' "$CID")
            RESTARTS=${RESTARTS:-0}
            echo "status=$STATUS, 재시작=${RESTARTS}회"

            if [ "$STATUS" != "running" ] || [ "$RESTARTS" -gt 0 ]; then
              echo "ERR: $SERVICE 비정상 (status=$STATUS, 재시작=${RESTARTS}회) — 최근 로그 100줄"
              docker compose -f "$COMPOSE_FILE" logs --tail=100 "$SERVICE"
              exit 1
            fi

            echo "=== nginx 업스트림 갱신 ==="
            docker compose -f "$COMPOSE_FILE" exec -T nginx nginx -s reload \
              || echo "WARN: nginx reload 실패 — 502 발생 시 'docker compose restart nginx' 필요"

            docker image prune -f
            echo "=== 배포 완료: $SERVICE 정상 기동 ==="
